<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alvyl - Human &amp; Meaningful</title>
    <meta
      name="description"
      content="We create genuine experiences that meet real needs. From MVPs to enterprise solutions—Site Reliability, Agentic AI, IoT &amp; Machine Learning."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alvyl" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Admin URLs that have no file of their own (/admin without the slash, or the dev server's
      /admin/): go to the CMS page itself (public/admin, Sveltia CMS) before the site renders;
      main.tsx checks the flag and stays out of the way.
    -->
    <script>
      ;(function () {
        var admin = '%BASE_URL%admin/'
        var path = location.pathname
        if (path.indexOf(admin) !== 0 && path !== admin.slice(0, -1)) return
        if (/\/index\.html$/.test(path)) return // the file itself is missing: show the 404
        window.__alvylAdmin = true
        var hr = path.indexOf(admin + 'hr') === 0
        location.replace(admin + (hr ? 'hr/' : '') + 'index.html' + location.hash)
      })()
    </script>
    <!--
      Home hero, when WebGL exists: story mode (pinned murmuration) when motion is allowed, calm mode
      (the same flock, slower, in the plain card) when the visitor asked for reduced motion. Set before
      first paint so the layout never shifts; the hero removes it again if the flock can't start.
    -->
    <script>
      try {
        if ('WebGLRenderingContext' in window)
          document.documentElement.setAttribute(
            matchMedia('(prefers-reduced-motion: reduce)').matches ? 'data-calm' : 'data-story',
            '',
          )
      } catch (e) {}
    </script>
    <!-- Fonts used above the fold: fetch in parallel with the CSS instead of after it. -->
    <link rel="preload" href="/fonts/IvyMode-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/FormaDJRMicro-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
