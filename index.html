<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icon: only the "al" letters, no background: black on light tabs, white on dark ones.
         favicon.png (the black square) stays for home screens and the Organization logo. -->
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alvyl - Human &amp; Meaningful</title>
    <meta
      name="description"
      content="We create genuine experiences that meet real needs. From MVPs to enterprise solutions—Site Reliability, Agentic AI, IoT &amp; Machine Learning."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alvyl" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Admin URLs that have no file of their own (/admin without the slash, or the dev server's
      /admin/): go to the CMS page itself (public/admin, Sveltia CMS) before the site renders;
      main.tsx checks the flag and stays out of the way.
    -->
    <script>
      ;(function () {
        var admin = '%BASE_URL%admin/'
        var path = location.pathname
        if (path.indexOf(admin) !== 0 && path !== admin.slice(0, -1)) return
        if (/\/index\.html$/.test(path)) return // the file itself is missing: show the 404
        window.__alvylAdmin = true
        var hr = path.indexOf(admin + 'hr') === 0
        location.replace(admin + (hr ? 'hr/' : '') + 'index.html' + location.hash)
      })()
    </script>
    <!--
      Home hero, when WebGL exists: story mode (pinned murmuration) when motion is allowed, calm mode
      (the same flock, slower, in the plain card) when the visitor asked for reduced motion. Set before
      first paint so the layout never shifts; the hero removes it again if the flock can't start.
    -->
    <script>
      try {
        if ('WebGLRenderingContext' in window)
          document.documentElement.setAttribute(
            matchMedia('(prefers-reduced-motion: reduce)').matches ? 'data-calm' : 'data-story',
            '',
          )
      } catch (e) {}
    </script>
    <!--
      Google Analytics 4: production builds only (Vite fills in %DEV%), never on /admin. Page views
      on in-site navigation come from GA's enhanced measurement (browser history events).
      Microsoft Clarity starts in src/main.tsx.
    -->
    <script>
      ;(function () {
        if (window.__alvylAdmin || '%DEV%' === 'true') return
        var id = 'G-DHNZ9P5V8C'
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () {
          dataLayer.push(arguments)
        }
        gtag('js', new Date())
        gtag('config', id)
      })()
    </script>
    <!-- Fonts used above the fold: fetch in parallel with the CSS instead of after it. -->
    <link rel="preload" href="/fonts/IvyMode-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/FormaDJRMicro-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
